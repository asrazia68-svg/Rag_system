<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface2: #1c1c27;
            --border: #2a2a3d;
            --accent: #7c6aff;
            --accent2: #ff6a9b;
            --text: #e8e8f0;
            --text-muted: #6b6b8a;
            --bot-bg: #1c1c27;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(124,106,255,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(255,106,155,0.06) 0%, transparent 50%);
            animation: bgShift 15s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes bgShift {
            0% { transform: translate(0,0) rotate(0deg); }
            100% { transform: translate(3%,3%) rotate(2deg); }
        }
        header {
            position: relative; z-index: 10;
            padding: 18px 28px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(13,13,20,0.8);
            backdrop-filter: blur(20px);
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #7c6aff, #ff6a9b);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(124,106,255,0.4);
        }
        .logo-text {
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem;
            background: linear-gradient(135deg, #7c6aff, #ff6a9b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo-sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.05em; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .status-dot {
            width: 8px; height: 8px; background: #4ade80;
            border-radius: 50%; box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.6; transform:scale(0.85); }
        }
        .status-text { font-size: 0.75rem; color: #4ade80; font-weight: 500; }
        .clear-btn {
            padding: 7px 16px; background: transparent;
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-muted); font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s; font-family: 'DM Sans', sans-serif;
        }
        .clear-btn:hover { border-color: #ff6a9b; color: #ff6a9b; background: rgba(255,106,155,0.08); }
        #chat-box {
            flex: 1; overflow-y: auto; padding: 28px;
            position: relative; z-index: 1; scroll-behavior: smooth;
        }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .message { display: flex; margin-bottom: 20px; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(12px); }
            to { opacity:1; transform:translateY(0); }
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .msg-content { max-width: 68%; }
        .msg-bubble { padding: 13px 18px; border-radius: 18px; font-size: 0.92rem; line-height: 1.65; }
        .user .msg-bubble {
            background: linear-gradient(135deg, #7c6aff, #ff6a9b);
            color: white; border-radius: 18px 18px 4px 18px;
            box-shadow: 0 4px 20px rgba(124,106,255,0.3);
        }
        .bot .msg-bubble {
            background: var(--bot-bg); color: var(--text);
            border-radius: 18px 18px 18px 4px; border: 1px solid var(--border);
        }
        .bot-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #7c6aff, #ff6a9b);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; margin-right: 10px; flex-shrink: 0; margin-top: 4px;
        }
        .loading-dots { display: flex; gap: 5px; padding: 5px 0; }
        .loading-dots span {
            width: 7px; height: 7px; background: #7c6aff;
            border-radius: 50%; animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,60%,100% { transform:translateY(0); opacity:0.5; }
            30% { transform:translateY(-6px); opacity:1; }
        }
        .welcome { text-align: center; padding: 40px 20px; }
        .welcome-icon { font-size: 3rem; margin-bottom: 16px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%,100% { transform:translateY(0); }
            50% { transform:translateY(-8px); }
        }
        .welcome h2 {
            font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #7c6aff, #ff6a9b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .chip {
            padding: 7px 14px; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 20px;
            font-size: 0.8rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
        }
        .chip:hover { border-color: #7c6aff; color: #7c6aff; background: rgba(124,106,255,0.08); }
        .input-wrapper {
            position: relative; z-index: 10;
            padding: 16px 28px 20px;
            background: rgba(13,13,20,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }
        .input-box {
            display: flex; align-items: center; gap: 10px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 14px; padding: 6px 6px 6px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus-within { border-color: #7c6aff; box-shadow: 0 0 0 3px rgba(124,106,255,0.12); }
        #question {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text); font-size: 0.93rem;
            font-family: 'DM Sans', sans-serif; padding: 8px 0;
        }
        #question::placeholder { color: var(--text-muted); }
        #send-btn {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #7c6aff, #ff6a9b);
            border: none; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 2px 12px rgba(124,106,255,0.35);
        }
        #send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 18px rgba(124,106,255,0.5); }
        #send-btn svg { width: 18px; height: 18px; fill: white; }
        .input-hint { text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; }
    </style>
</head>
<body>
<header>
    <div class="logo">
        <div class="logo-icon">🧠</div>
        <div>
            <div class="logo-text">RAG Chat</div>
            <div class="logo-sub">Document Intelligence</div>
        </div>
    </div>
    <div class="header-actions">
        <div class="status-dot"></div>
        <span class="status-text">Online</span>
        <button class="clear-btn" onclick="clearHistory()">✕ Clear</button>
    </div>
</header>

<div id="chat-box">
    <div class="welcome">
        <span class="welcome-icon">✨</span>
        <h2>Ask Your Documents!</h2>
        <p>I have read all your documents.<br>Ask me anything — I will answer!</p>
        <div class="suggestions">
            <div class="chip" onclick="useChip(this)">📄 What is in the documents?</div>
            <div class="chip" onclick="useChip(this)">🔍 What is the main topic?</div>
            <div class="chip" onclick="useChip(this)">📊 Give me a summary</div>
        </div>
    </div>
</div>

<div class="input-wrapper">
    <div class="input-box">
        <input type="text" id="question" placeholder="Ask me anything..."
               onkeypress="if(event.key==='Enter') sendMessage()"/>
        <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
    <div class="input-hint">Press Enter or click button • RAG powered by Groq</div>
</div>

<script>
    let welcomeShown = true;

    function useChip(el) {
        document.getElementById('question').value = el.textContent.replace(/^[^\s]+\s/, '');
        sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('question');
        const question = input.value.trim();
        if (!question) return;

        if (welcomeShown) {
            document.querySelector('.welcome')?.remove();
            welcomeShown = false;
        }

        addMessage(question, 'user');
        input.value = '';
        const loadingId = addLoading();

        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await response.json();
            removeLoading(loadingId);
            addMessage(data.answer, 'bot');
        } catch (err) {
            removeLoading(loadingId);
            addMessage('Connection error! Please check the server.', 'bot');
        }
    }

    function addMessage(text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `message ${type}`;
        if (type === 'bot') {
            div.innerHTML = `<div class="bot-avatar">🧠</div><div class="msg-content"><div class="msg-bubble">${text}</div></div>`;
        } else {
            div.innerHTML = `<div class="msg-content"><div class="msg-bubble">${text}</div></div>`;
        }
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function addLoading() {
        const box = document.getElementById('chat-box');
        const id = 'load-' + Date.now();
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = id;
        div.innerHTML = `<div class="bot-avatar">🧠</div><div class="msg-content"><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return id;
    }

    function removeLoading(id) { document.getElementById(id)?.remove(); }

    async function clearHistory() {
        await fetch('/clear', { method: 'POST' });
        document.getElementById('chat-box').innerHTML = `
            <div class="welcome">
                <span class="welcome-icon">✨</span>
                <h2>Ask Your Documents!</h2>
                <p>I have read all your documents.<br>Ask me anything — I will answer!</p>
                <div class="suggestions">
                    <div class="chip" onclick="useChip(this)">📄 What is in the documents?</div>
                    <div class="chip" onclick="useChip(this)">🔍 What is the main topic?</div>
                    <div class="chip" onclick="useChip(this)">📊 Give me a summary</div>
                </div>
            </div>`;
        welcomeShown = true;
    }
</script>
</body>
</html>
